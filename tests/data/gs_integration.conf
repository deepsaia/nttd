# The world the live GameScript suite is written against.
#
# A scenario config, not a settings payload, because that is how a benchmark run delivers a
# seed: the config is converted by scenario_to_settings, which emits the internal _map_seed
# key, and SessionRuntime passes it to OpenTTD as -G. Only the command-line flag pins
# generation; game_creation.generation_seed in a config does nothing on OpenTTD 15.3.
#
# So pinning the seed the way a real run does also tests the path a real run uses. The suite
# previously set map size, towns and sea level directly and named no seed at all, so OpenTTD
# generated a different 128x128 world every run and the placement tests passed or failed on the
# luck of the map. One observed run had five failures rooted in "could not build dock A",
# because that world had no suitable coastal tile, and build_road_stop returning no station_id.
#
# This is a TEST FIXTURE and not a benchmark tier. It lives outside config/benchmark so it
# neither ships in the wheel nor gets mistaken for something a contestant should run, and it
# opts out of scoring explicitly.
#
# It needs to: 128x128 IS an allowed size and the rest of the world conforms, so without
# scored = false this would be a scoreable scenario, and a scored session refuses the operator
# operations a test fixture may want. Setting starting_year also deviates from the locked 2020,
# which alone would make it unscoreable, but saying so outright is better than relying on that.

scenario {
  name        = "gs-integration"
  description = "Fixed world for the live GameScript suite: 128x128, 1960, coast and towns"
  id          = "gs-integration"

  # Never scored: this is a fixture, and a scored session refuses operator operations.
  scored = false

  map {
    size_x       = 128
    size_y       = 128
    terrain_type = "flat"

    # 1960 rather than the locked 2020, which is what the suite was written against: it wants
    # every vehicle type available and the early engines its tests buy.
    starting_year = 1960

    # High sea rather than the locked medium. The dock tests need a coastline to exist at all,
    # and inheriting medium produced a world that may have none, which is one of the two root
    # failures this fixture is here to stop.
    sea_level = "high"

    # Four towns, so the bus stop and airport tests have somewhere to build. Locked normal
    # gives two on a map this small.
    number_towns      = "custom"
    custom_town_number = 4

    # The whole point. Chosen because this world offers what the placement tests need: a
    # coastal tile a dock fits on, and a road-adjacent tile a bus stop fits on.
    seed = 1001
  }

  companies {
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  end_conditions {
    logic = "any"
    # Long enough that the suite never races the clock. The fixture stops the session itself.
    time_limit {
      enabled      = true
      wall_minutes = 60
    }
  }
}
