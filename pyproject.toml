[project]
name = "nttd"
dynamic = ["version"]
description = "Agent-agnostic API server wrapping OpenTTD as an AI simulation environment"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# One list, so `uv sync` gives a working install with nothing else to remember.
#
# The rl, dev and mcp extras are gone deliberately. An optional group is a decision a
# reader has to make before they can run anything, and every one of them was needed by
# something documented: the Gym environment by RL and ES entries, pytest and ruff by
# anyone changing code, mcp by the MCP surface. The cost of folding them in is a
# heavier install; the cost of keeping them apart was a `nttd analyze` that worked and
# a `NttdEnv` that raised ImportError on the same checkout.
#
# The test of that rule is "needed by something documented", which cuts both ways. seaborn
# and matplotlib were listed here and imported by nothing at all: 49 MB installed, for no
# feature. Removed rather than moved behind an extra, which is the distinction. plotly stays
# because `nttd analyze` and the report renderer import it, and imageio because the video
# report does.
dependencies = [
    # Server and API
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "requests>=2.32.5",
    # OpenTTD admin protocol and config
    "pyopenttdadmin>=1.0.4",
    "pyhocon>=0.3.60",
    "setuptools>=40,<72",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0",
    # Record and analysis
    "pyarrow>=18.0",
    "polars>=1.39.3",
    # Declared because analysis/plots.py imports it. It was reaching the environment only as
    # a dependency of seaborn, so removing seaborn broke `nttd analyze` on a fresh install.
    # An undeclared dependency that happens to be present is a working install by luck.
    "pandas>=2.2",
    "plotly>=6.6.0",
    "kaleido>=1.2.0",
    # imageio[pyav] rather than plain imageio: the video report imports av directly, and the
    # pyav extra is what guarantees it. pillow is declared for the same reason pandas is,
    # reports/video.py imports PIL, and it was arriving only because plotly and imageio
    # happen to depend on it.
    "imageio[pyav]>=2.37.3",
    "pillow>=11.0",
    # RL and ES surface: nttd.rl.env and nttd.rl.multi_env
    "gymnasium>=1.0.0",
    "numpy>=2.0",
    # MCP surface
    "mcp[cli]>=1.9",
    # Tests and lint
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
nttd = "nttd.cli.app:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4,<1.0"]
build-backend = "hatchling.build"

# The version IS the release tag, read from git rather than written here.
#
# It was duplicated: pyproject said 0.1.0 while the 0.0.2 release was cut, so publish refused
# at its own version gate and nothing was uploaded. The gate was right and the duplication was
# the bug: two places holding one fact, and a release is exactly when they diverge.
[tool.hatch.version]
source = "vcs"

# A build with no git history, from an unpacked sdist for instance, has no tag to read. 0.0.0
# rather than an error, and deliberately not a plausible number: the publish workflow compares
# the built version against the release tag, so a 0.0.0 slipping into a release fails there
# rather than reaching PyPI.
fallback-version = "0.0.0"

# No tag pattern set: the default already accepts a bare version like 0.0.2 as well as v0.0.2,
# and the option for narrowing it is tag_regex rather than tag_pattern, which this backend
# rejects outright.

[tool.hatch.build.targets.wheel]
# Only the engine. The reference runners live in deepsaia/nttd-examples: they are
# contestant-side code, they talk HTTP rather than importing nttd, and a top-level
# package literally named "agents" collided with the OpenAI Agents SDK for anyone
# who installed both.
packages = ["src/nttd"]

# nttd is not pure Python. Without these a wheel installs 179 files of code and none of the
# data it needs: no GameScript to load into OpenTTD, no base openttd.cfg to build a session
# config from, no action manifest to validate against, no scenario to run. Measured before
# this: pip install nttd produced a package that could not start a session, and asking it for
# the manifest looked above site-packages, because the loaders counted `..` from __file__ up
# to a repository root that does not exist once installed.
#
# Mapped under nttd/_data/ so nttd.resources can find them from the package rather than from
# the working directory. See src/nttd/resources.py, which is the only module that knows this
# layout.
[tool.hatch.build.targets.wheel.force-include]
"ottd_config" = "nttd/_data/ottd_config"
"config/actions" = "nttd/_data/config/actions"
"config/benchmark" = "nttd/_data/config/benchmark"

# The sdist carries the same data, plus what is needed to regenerate it.
[tool.hatch.build.targets.sdist]
include = [
  "src/nttd",
  "ottd_config",
  "config",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# SVG source. A <text> element cannot be wrapped without changing what it renders,
# so the line-length rule does not apply to the diagram bodies.
"scripts/generate_diagrams.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gs_test: Integration tests requiring a live OpenTTD session (pass --session-id to run)",
]
