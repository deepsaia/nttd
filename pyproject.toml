[project]
name = "nttd"
version = "0.1.0"
description = "Agent-agnostic API server wrapping OpenTTD as an AI simulation environment"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pyopenttdadmin>=1.0.4",
    "pyhocon>=0.3.60",
    "typer>=0.12.0",
    "rich>=13.0",
    "requests>=2.32.5",
    "setuptools>=40,<72",
    "pyarrow>=18.0",
    "plotly>=6.6.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "kaleido>=1.2.0",
    "polars>=1.39.3",
    "imageio[pyav]>=2.37.3",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
rl = [
    "gymnasium>=1.0.0",
    "numpy>=2.0",
    "requests>=2.32",
]
mcp = [
    "mcp[cli]>=1.9",
    "httpx>=0.28.0",
]

[project.scripts]
nttd = "nttd.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the engine. The reference runners live in deepsaia/nttd-examples: they are
# contestant-side code, they talk HTTP rather than importing nttd, and a top-level
# package literally named "agents" collided with the OpenAI Agents SDK for anyone
# who installed both.
packages = ["src/nttd"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# SVG source. A <text> element cannot be wrapped without changing what it renders,
# so the line-length rule does not apply to the diagram bodies.
"scripts/generate_diagrams.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gs_test: Integration tests requiring a live OpenTTD session (pass --session-id to run)",
]
