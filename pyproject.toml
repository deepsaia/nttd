[project]
name = "nttd"
version = "0.1.0"
description = "Agent-agnostic API server wrapping OpenTTD as an AI simulation environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pyopenttdadmin>=1.0.4",
    "pyhocon>=0.3.60",
    "typer>=0.12.0",
    "rich>=13.0",
    "requests>=2.32.5",
    "setuptools>=40,<72",
    "pyarrow>=18.0",
    "langchain-openai>=1.1.12",
    "plotly>=6.6.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
    "kaleido>=1.2.0",
    "polars>=1.39.3",
    "imageio[pyav]>=2.37.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
rl = [
    "gymnasium>=1.0.0",
    "numpy>=2.0",
    "requests>=2.32",
]
agents = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "requests>=2.32",
    "websockets>=14.0",
]
agents-langgraph = [
    "langgraph>=0.3",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "requests>=2.32",
    "websockets>=14.0",
]
mcp = [
    "mcp[cli]>=1.9",
    "httpx>=0.28.0",
]

[project.scripts]
nttd = "nttd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agents/ is included so `from agents.base import ...` works after `uv sync`
packages = ["src/nttd", "agents"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gs_test: Integration tests requiring a live OpenTTD session (pass --session-id to run)",
]
