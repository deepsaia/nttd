# Lint and test on Linux, on every push and pull request.
#
# Linux specifically. Development happens on macOS, and the one thing a macOS-only check
# cannot catch is the platform assumption: OPENTTD_BINARY defaults to a hardcoded
# /Applications/OpenTTD.app path, so any code that touches it works here and fails there.
# The suite does not need OpenTTD, which is what makes this cheap to run.
#
# The gs_test suite is deliberately NOT run: it needs a live OpenTTD session and a session
# id, and conftest skips it unless -m gs_test is passed explicitly.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A force-push while CI is running should not leave two racing.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.13, so both supported versions are tested. Development
        # happens on 3.14; 3.13 is the floor the package claims and nothing else checks it.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tags, and enough history to reach the latest one. The version now comes from the
          # git tag, and checkout's default depth of 1 fetches no tags at all, which would
          # build every artifact as a dev version off an unknown base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # From uv.lock rather than resolving fresh, so CI tests the dependency set a
      # developer actually has. --frozen fails if the lock and pyproject disagree, which
      # is the drift worth catching.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Test
        run: uv run pytest -q

      # The manifest and the action docs are generated from the GameScript. A change to
      # main.nut that is committed without regenerating them makes the published surface
      # disagree with the game, which is the class of bug that produced issues #68 and
      # #108. The suite has a reproducibility test, and this makes the failure legible.
      - name: The generated action reference is up to date
        run: |
          uv run python scripts/generate_action_manifest.py
          git diff --exit-code -- config/actions/manifest.json docs/

  # A wheel is the only place the packaging bug shows. The suite above runs against the source
  # tree, where the data sits at the relative paths the loaders expect, so it passed happily
  # while `pip install nttd` produced a package that could not start a session.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tags, and enough history to reach the latest one. The version now comes from the
          # git tag, and checkout's default depth of 1 fetches no tags at all, which would
          # build every artifact as a dev version off an unknown base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: The wheel carries the data nttd needs to run
        run: uv run python scripts/check_wheel_contents.py dist/*.whl

      # Installed, in a clean environment, from a directory that is not the repository. Run
      # from /tmp deliberately: the old default for the GameScript was the relative string
      # "ottd_config", which resolved only when the server was started from the checkout.
      - name: Smoke test the installed package
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import json
          from nttd import resources
          from nttd.config.action_manifest import MANIFEST_PATH
          from nttd.config.scenario_config import load

          gamescript = resources.gamescript_dir() / 'game' / 'nttd-gs' / 'main.nut'
          assert gamescript.exists(), gamescript
          assert (resources.gamescript_dir() / 'openttd.cfg').exists()
          actions = json.loads(MANIFEST_PATH.read_text())['actions']
          assert len(actions) > 100, len(actions)
          assert load().name
          print(f'installed nttd resolved its data: {len(actions)} actions')
          "
          /tmp/smoke/bin/nttd --help > /dev/null
