# Lint and test on Linux, on every push and pull request.
#
# Linux specifically. Development happens on macOS, and the one thing a macOS-only check
# cannot catch is the platform assumption. The binary path used to be a hardcoded
# /Applications/OpenTTD.app string in six places, so anything touching it worked there and
# failed here. The suite itself needs no OpenTTD, which is what makes it cheap to run.
#
# The gs_test suite is deliberately NOT run: it needs a live OpenTTD session and a session
# id, and conftest skips it unless -m gs_test is passed explicitly. The session job below
# covers the question that mattered, which is whether a game starts on Linux at all.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A force-push while CI is running should not leave two racing.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.13, so both supported versions are tested. Development
        # happens on 3.14; 3.13 is the floor the package claims and nothing else checks it.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tags, and enough history to reach the latest one. The version now comes from the
          # git tag, and checkout's default depth of 1 fetches no tags at all, which would
          # build every artifact as a dev version off an unknown base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # From uv.lock rather than resolving fresh, so CI tests the dependency set a
      # developer actually has. --frozen fails if the lock and pyproject disagree, which
      # is the drift worth catching.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Test
        run: uv run pytest -q

      # The manifest and the action docs are generated from the GameScript. A change to
      # main.nut that is committed without regenerating them makes the published surface
      # disagree with the game, which is the class of bug that produced issues #68 and
      # #108. The suite has a reproducibility test, and this makes the failure legible.
      - name: The generated action reference is up to date
        run: |
          uv run python scripts/generate_action_manifest.py
          git diff --exit-code -- config/actions/manifest.json docs/

  # A wheel is the only place the packaging bug shows. The suite above runs against the source
  # tree, where the data sits at the relative paths the loaders expect, so it passed happily
  # while `pip install nttd` produced a package that could not start a session.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Tags, and enough history to reach the latest one. The version now comes from the
          # git tag, and checkout's default depth of 1 fetches no tags at all, which would
          # build every artifact as a dev version off an unknown base.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: The wheel carries the data nttd needs to run
        run: uv run python scripts/check_wheel_contents.py dist/*.whl

      # Installed, in a clean environment, from a directory that is not the repository. Run
      # from /tmp deliberately: the old default for the GameScript was the relative string
      # "ottd_config", which resolved only when the server was started from the checkout.
      - name: Smoke test the installed package
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import json
          from nttd import resources
          from nttd.config.action_manifest import MANIFEST_PATH
          from nttd.config.scenario_config import load

          gamescript = resources.gamescript_dir() / 'game' / 'nttd-gs' / 'main.nut'
          assert gamescript.exists(), gamescript
          assert (resources.gamescript_dir() / 'openttd.cfg').exists()
          actions = json.loads(MANIFEST_PATH.read_text())['actions']
          assert len(actions) > 100, len(actions)
          assert load().name
          print(f'installed nttd resolved its data: {len(actions)} actions')
          "
          /tmp/smoke/bin/nttd --help > /dev/null

  # Can nttd start a game on Linux? Nothing answered that before. The suite needs no OpenTTD
  # on purpose, the package check only proves the data files ship, and the live GameScript
  # suite has to be handed a session. So every check passed on a machine where playing was
  # impossible, which is how nttd came to be macOS-only in practice unnoticed.
  #
  # This installs the pinned OpenTTD, starts the server with no NTTD_OPENTTD_BINARY set so the
  # PATH lookup is what gets exercised, and plays the smallest possible game.
  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # apt would give openttd 13.4 on ubuntu-latest, two majors behind what nttd targets.
      # See the script: no distribution packages 15.3.
      - name: Install the pinned OpenTTD
        run: sudo ./scripts/install_openttd.sh

      - name: A session runs on Linux
        run: |
          uv run nttd server --port 8000 > /tmp/nttd-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1 && break
            sleep 2
          done
          uv run python scripts/smoke_session.py --base-url http://127.0.0.1:8000

      - name: The server log, when the game did not start
        if: failure()
        run: cat /tmp/nttd-server.log

  # The image a contestant runs. Built here because it is the only way to know it still
  # builds, and smoke tested from inside so a broken game is caught rather than shipped.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the image
        run: docker build -t nttd:ci .

      - name: OpenTTD in the image runs, and is the version nttd targets
        run: |
          docker run --rm nttd:ci openttd --version | head -2
          docker run --rm nttd:ci openttd --version | grep -q "15\.3" \
            || { echo "the image does not contain OpenTTD 15.3"; exit 1; }

      - name: A session runs in the image
        run: |
          docker run -d --name nttd-ci -p 8000:8000 nttd:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1 && break
            sleep 2
          done
          docker exec nttd-ci python scripts/smoke_session.py --base-url http://127.0.0.1:8000

      - name: The container log, when the game did not start
        if: failure()
        run: docker logs nttd-ci || true
