# 20-minute rail MAS benchmark via neuro-san
# Requires neuro-san server running on port 8080 with rail_mas agent network

scenario {

  name        = "rail-mas-20min"
  description = "20-minute benchmark with neuro-san rail multi-agent system"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    # Was "hilly", but nttd's terrain enum was off by one, so these maps
    # were always generated Flat. Pinned to "flat" to preserve the terrain
    # these benchmarks actually ran on; set "hilly" for genuinely hilly maps.
    terrain_type = "flat"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    # Map generation seed. Reproducibility requires this: the same seed
    # yields the same world, which is what makes runs comparable.
    seed = 1001
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    # game_speed removed: OpenTTD 15.3 has no speed control. The economy
    # clock is fixed at 1 wall-minute per economy month.
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 0
  }

  # Operator-owned pacing and budget limits. Enforced only when scored = true,
  # so a contestant cannot set their own budget in a scored run.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
    observation_mode      = "agent"
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 20
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "rail_mas"
      company_id        = 0
      nttd_framework    = "mas"
      # agent_type here is used to filter tools
      agent_type        = "rail"
      instructions      = """Run this cycle. Your goal is to generate and increase revenue over time by building profitable rail routes. 
Use your agents and tools and take necessary actions to do so consistently."""
      observation_mode  = "mas_rail"
      include_finance   = true
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 50
      mas_transport {
        protocol      = "http"
        mas_framework = "neuro_san"
        endpoint  = "http://localhost:8080/api/v1/rail_mas/streaming_chat"
        timeout   = 300.0
        retry_count = 1
        retry_backoff = 2.0
      }
    }
  ]
}
