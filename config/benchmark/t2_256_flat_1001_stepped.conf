# Example scored benchmark scenario for RL and ES, played in stepped mode.
#
# Same world as t2_256_flat_1001_realtime.conf and the same task_id inputs except the runtime mode
# and the end condition, so a stepped entry and a real-time entry face the same
# problem. What differs is who owns the clock.
#
# In stepped mode the game is PAUSED between steps. A policy may deliberate for as
# long as it likes without the world moving, which is what makes an RL or ES run
# comparable at all: training-time inference speed stops being part of the score.
#
#   uv run nttd benchmark --config config/benchmark/t2_256_flat_1001_stepped.conf
#
# Your loop then drives it:
#   POST /v1/participant/sessions/{id}/step/reset   -> opening observation
#   POST /v1/participant/sessions/{id}/step         -> flush actions, advance, observe
#
# or through the Gym wrapper, which is an ordinary client over those same routes:
#   from nttd.rl.env import NttdEnv
#   env = NttdEnv(session_id=..., token=...)
#
# ---------------------------------------------------------------------------
# Why steps and not wall-minutes
# ---------------------------------------------------------------------------
# A stepped run cannot be bounded by wall time. The clock only advances when the
# contestant asks, so wall time measures how slow their hardware is rather than how
# much of the game was played, and a slow policy would be cut off mid-run. nttd
# refuses that combination rather than letting it look reasonable.
#
# 61 steps of 15 game-days is about 915 days, which is the same 2.5 game years a
# T2 real-time run covers in 30 wall-minutes.

# ---------------------------------------------------------------------------
# Why 61 steps and not 60
# ---------------------------------------------------------------------------
# Because the score is the rating of the last COMPLETED quarter, and 61 steps lands
# just past a quarter boundary while 60 lands just short of one.
#
# From the profile's 2020-01-01 start, at 15 game-days a step:
#
#   60 steps = 900 days, ending 2022-06-19: 9 completed quarters,
#              and the final rating is 79 days stale
#   61 steps = 915 days, ending 2022-07-04: 10 completed quarters,
#              and the final rating is 3 days stale
#
# At 60 the published score describes the company as it stood a quarter earlier,
# so roughly the last fifth of the run does not count towards it. The odd number is
# deliberate: it buys a score that reflects what the company actually became.
#
# Exact alignment is not available. Five and ten calendar quarters are 456 and 913 days,
# and neither is a multiple of 15, so some remainder is unavoidable. This picks the
# remainder that falls after the boundary rather than before it.

scenario {

  name        = "benchmark-t2-256-flat-1001-stepped"
  description = "Example T2 benchmark for RL and ES: 61 steps of 15 game-days"
  id          = "benchmark-t2-256-flat-1001-stepped"


  map {
    size_x       = 256
    size_y       = 256
    terrain_type = "flat"
    seed         = 1001
  }

  companies {
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    # No loop runs on the server: the contestant drives every step.
    mode                   = "stepped"
    snapshot_interval_days = 1
  }

  heartbeat {
    # Game-days per step. The step size is part of the task, so a scored run cannot
    # override it per request -- choosing a smaller step would buy more decisions
    # over the same horizon.
    interval_days = 15
  }

  end_conditions {
    logic = "any"

    # Explicitly off. time_limit defaults to ENABLED at 60 minutes, so a stepped
    # scenario that simply omits it still ends on a wall clock -- which is the one
    # bound that means nothing here.
    time_limit {
      enabled = false
    }

    # Steps, not wall time. See the note above.
    max_heartbeats {
      enabled = true
      count   = 61
    }

    # A scored company that goes bankrupt has nothing left to measure.
    bankruptcy {
      enabled = true
    }
  }
}
