# T2 example benchmark scenario, played in stepped mode.
#
# T2: 731 steps of one game day, 8 completed quarters, .
# a year: long enough for a first route to start paying, still short of a business.
#
# The world is 256x256 flat seed 1001, shared with t2_256_flat_1001_realtime, so the two differ only
# in who owns the clock. See README.md in this directory for the tier table, why the day counts
# are what they are, and why a stepped run is not bounded by wall time.
#
#   uv run nttd benchmark --config config/benchmark/t2_256_flat_1001_stepped.conf
#
# Your loop then drives it:
#   POST /v1/participant/sessions/{id}/step/reset   -> opening observation
#   POST /v1/participant/sessions/{id}/step         -> flush actions, advance one day, observe

scenario {
  name        = "benchmark-t2-256-flat-1001-stepped"
  description = "T2 benchmark, stepped: 731 steps of 1 game-day, 8 completed quarters"
  id          = "benchmark-t2-256-flat-1001-stepped"

  map {
    size_x       = 256
    size_y       = 256
    terrain_type = "flat"
    seed         = 1001
  }

  companies {
    # No AI opponents, by design: nttd measures building a business in an empty market.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "stepped"
    snapshot_interval_days = 1
  }

  heartbeat {
    # One game day per step. A step flushes its actions while the game is paused, so a batch
    # of any size still advances exactly one day.
    interval_days = 1
  }

  end_conditions {
    logic = "any"
    # Bounded in steps, not wall time: the clock only moves when the contestant asks.
    time_limit {
      enabled = false
    }
    max_heartbeats {
      enabled = true
      count   = 731
    }
    bankruptcy {
      enabled = true
    }
  }
}
