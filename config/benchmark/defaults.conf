# Locked world settings shared by every scored benchmark scenario.
#
# Include this from a scenario's map block rather than restating the values:
#
#   scenario {
#     scored = true
#     map {
#       include "defaults.conf"
#       size_x = 256          # allowed to differ, shown as a leaderboard column
#       size_y = 256
#     }
#   }
#
# Includes resolve relative to the including FILE, not the working directory, so a
# scenario in this directory writes "defaults.conf" and one a level up writes
# "benchmark/defaults.conf".
#
# These are locked because a difference changes the problem without being visible
# to anyone reading a score. Nobody looking at 812 can tell it was earned with
# denser industry, so the number only means something if the world is fixed.
# src/nttd/config/benchmark_profile.py is the enforcing copy and refuses a scored
# scenario that deviates; this file exists so authors inherit the values instead
# of retyping them.
#
# Map size, landscape, and terrain_type are deliberately NOT here. They may vary,
# because each is recorded as a leaderboard column and a reader can discount a
# comparison across them.

variety = "none"
smoothness = "smooth"
rivers = "medium"
sea_level = "medium"

# Individual water_borders_* flags are omitted on purpose: OpenTTD ignores them
# unless map_edges = "manual", so listing them would imply they take effect.
map_edges = "random"

# 2020 rather than a mid-century start. Verified against OpenTTD 15.3: the year is
# accepted and reported back unclamped, and every transport mode has more stock to
# choose from than at 1960 (train 39 -> 40, road 11 -> 21, ship 3 -> 4,
# aircraft 5 -> 12), so the tech tree is wider rather than narrower.
starting_year = 2020

town_names = "english"
number_towns = "normal"
industry_density = "normal"
