# T1 scored benchmark scenario, played in stepped mode.
#
# T1 is the shortest tier: 15 minutes of real time, about 1.25 game years. Tiers are
# TIME tiers, not worlds. The world here is the same 256x256 flat seed 1001 that
# t2_256_flat_1001_stepped uses, so the two differ only in how much of the game is played.
#
#   uv run nttd benchmark --config config/benchmark/t1_256_flat_1001_stepped.conf
#
# Your loop then drives it:
#   POST /v1/participant/sessions/{id}/step/reset   -> opening observation
#   POST /v1/participant/sessions/{id}/step         -> flush actions, advance, observe
#
# ---------------------------------------------------------------------------
# What T1 measures, and what it does not
# ---------------------------------------------------------------------------
# T1 is the build-skill tier and is largely PRE-REVENUE. A transport company spends its
# first year building and its later years earning, so 1.25 years mostly measures whether
# a contestant can get a working route standing at all. Economic performance only becomes
# measurable around T3.
#
# So read a low score here as "did it build something that works", not as "is this a good
# business". Comparing a T1 entry with a T3 one is comparing two different questions,
# which is why they carry different task ids and the board keeps them apart.
#
# ---------------------------------------------------------------------------
# Why steps and not wall-minutes
# ---------------------------------------------------------------------------
# A stepped run cannot be bounded by wall time. The clock only advances when the
# contestant asks, so wall time would measure how fast their hardware is rather than how
# much of the game was played, and a slow policy would be cut off mid-run. nttd refuses
# that combination rather than letting it look reasonable.
#
# The step count is chosen to reach T1's game horizon, not a clock:
#
#   T1   15 wall-minutes real time    about 465 game-days    1.27 game years
#        31 steps x 15 game-days    =       465 game-days
#
#   T2   30 wall-minutes real time    about 915 game-days    2.5 game years
#        61 steps x 15 game-days    =       915 game-days
#
# ---------------------------------------------------------------------------
# Why fewer steps rather than a smaller step
# ---------------------------------------------------------------------------
# Halving interval_days instead would keep 61 decisions over half the world, which makes
# a denser task rather than a shorter one. The step size is part of what a scenario asks,
# so it is held at 15 and the count is what moves. A T1 entry is then the same game as a
# T2 entry, stopped earlier.

# ---------------------------------------------------------------------------
# Why 31 steps and not 30
# ---------------------------------------------------------------------------
# Because the score is the rating of the last COMPLETED quarter, and 31 steps lands
# just past a quarter boundary while 30 lands just short of one.
#
# From the profile's 2020-01-01 start, at 15 game-days a step:
#
#   30 steps = 450 days, ending 2021-03-26: 4 completed quarters,
#              and the final rating is 84 days stale
#   31 steps = 465 days, ending 2021-04-10: 5 completed quarters,
#              and the final rating is 9 days stale
#
# At 30 the published score describes the company as it stood a quarter earlier,
# so roughly the last fifth of the run does not count towards it. The odd number is
# deliberate: it buys a score that reflects what the company actually became.
#
# Exact alignment is not available. Five and ten calendar quarters are 456 and 913 days,
# and neither is a multiple of 15, so some remainder is unavoidable. This picks the
# remainder that falls after the boundary rather than before it.

scenario {

  name        = "benchmark-t1-256-flat-1001-stepped"
  description = "T1 benchmark for RL, ES and agents, stepped: 31 steps of 15 game-days"
  id          = "benchmark-t1-256-flat-1001-stepped"


  map {
    size_x       = 256
    size_y       = 256
    terrain_type = "flat"
    seed         = 1001
  }

  companies {
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    # No loop runs on the server: the contestant drives every step.
    mode                   = "stepped"
    snapshot_interval_days = 1
  }

  heartbeat {
    # Game-days per step, held at 15 to match the other stepped tiers. The step size is
    # part of the task, so a scored run cannot override it per request: a smaller step
    # would buy more decisions over the same horizon.
    interval_days = 15
  }

  end_conditions {
    logic = "any"

    # Explicitly off. time_limit defaults to ENABLED at 60 minutes, so a stepped
    # scenario that simply omits it still ends on a wall clock, which is the one bound
    # that means nothing here.
    time_limit {
      enabled = false
    }

    max_heartbeats {
      enabled = true
      count   = 31
    }

    # A scored company that goes bankrupt has nothing left to measure.
    bankruptcy {
      enabled = true
    }
  }
}
