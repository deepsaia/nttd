# Example scored benchmark scenario. Copy it and change what you like, inside the
# ranges documented below.
#
# There is no list of approved scenarios. A run is a benchmark run if the scenario
# sets scored = true and stays inside the profile; nttd refuses a scored scenario
# that does not, naming every violation. Your run is then comparable to every other
# run of the same world, where "same world" means the same task_id -- which is
# derived from these settings, so two people who write the same world independently
# land on the same task and the same leaderboard grouping.
#
#   uv run nttd benchmark --config config/benchmark/t2_example.conf
#
# ---------------------------------------------------------------------------
# TIER: pick one. This is the only thing a tier fixes.
# ---------------------------------------------------------------------------
# The economy clock is fixed at 1 wall-minute per economy month and no OpenTTD 15.3
# setting changes it, so wall_minutes IS the economy horizon:
#
#   T1   15 min    about 1.25 game years    build-skill tier, largely pre-revenue
#   T2   30 min    about 2.5 game years
#   T3   60 min    about 5 game years       economic performance becomes measurable
#   T4  120 min    about 10 game years      longer-running businesses
#
# ---------------------------------------------------------------------------
# WORLD: locked, except for four dimensions.
# ---------------------------------------------------------------------------
# Locked by benchmark/defaults.conf and NOT changeable in a scored run:
#   variety = none          smoothness = smooth      rivers = medium
#   sea_level = medium      map_edges = random       starting_year = 2020
#   town_names = english    number_towns = normal    industry_density = normal
#
# Free to vary, because each is recorded as a leaderboard column:
#
#   size_x, size_y   64 | 128 | 256 | 512 | 1024
#                    Must be powers of two. 2048 and 4096 are excluded: observation
#                    is always the full entitled game state, and 2048x2048 is 16x
#                    the tiles of 1024x1024, which poses a payload problem rather
#                    than a transport one.
#
#   landscape        temperate | sub-arctic | sub-tropical | toyland
#                    Genuinely different economies, not reskins: cargo chains, town
#                    growth requirements, and available industries all differ.
#
#   terrain_type     very_flat | flat | hilly | mountainous | alpinist
#                    "custom" is refused, because it would unlock
#                    custom_terrain_height over 1..255 -- an unbounded world axis
#                    that no leaderboard column discloses, so two very different
#                    runs would read identically.
#
#   seed             any integer. Pin it: reproducibility is what makes a result
#                    checkable, and an unseeded run cannot be regenerated.

scenario {

  name        = "benchmark-t2-example"
  description = "Example T2 benchmark: 30 minutes, 256x256 temperate flat"
  id          = "benchmark-t2-example"
  # Bump on any change that should stop this comparing against earlier results.
  version     = "1"

  # Refuses game-mutating operator operations for the life of the session, for
  # every caller, and holds the map to the benchmark profile.
  scored = true

  map {
    include "defaults.conf"

    size_x       = 256
    size_y       = 256
    landscape    = "temperate"
    terrain_type = "flat"

    # Pins generation. Only the -G flag actually reproduces a world; the cfg key
    # alone does not, so this is read into _map_seed and passed at spawn.
    seed = 1001
  }

  companies {
    # 0..14 AI opponents. They compete for cargo and town ratings, so a run with
    # opponents is a different task from a solo one.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    # async_realtime for a leaderboard run; heartbeat for RL and ES, where
    # deliberation is unbounded and wall time therefore measures nothing.
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  # Operator-owned. A contestant cannot set its own budget in a scored run: these
  # decide how much anyone is allowed to do, so they belong to the task.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled      = true
      wall_minutes = 30
    }

    # A scored company that goes bankrupt has nothing left to measure.
    bankruptcy {
      enabled = true
    }
  }
}
