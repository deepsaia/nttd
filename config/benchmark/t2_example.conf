# Example scored benchmark scenario. Copy it and change what you like, inside the
# ranges documented below.
#
# There is no list of approved scenarios, and nothing here declares this one
# scoreable. Scoredness is COMPUTED from the world: stay inside the profile and the
# run is scored, whether or not the file says so. There is no `scored = true` below
# for that reason -- it would be an assertion anyone could write over any world, so
# it grants nothing. Write `scored = false` to opt out of a conforming world, which
# is what you want while authoring or debugging, since a scored session refuses
# operator powers.
#
# Your run is comparable to every other run of the same world, where "same world"
# means the same task_id -- derived from these settings, so two people who write the
# same world independently land on the same task and the same grouping.
#
#   uv run nttd benchmark --config config/benchmark/t2_example.conf
#
# ---------------------------------------------------------------------------
# TIER: pick one. This is the only thing a tier fixes.
# ---------------------------------------------------------------------------
# The economy clock is fixed at 1 wall-minute per economy month and no OpenTTD 15.3
# setting changes it, so wall_minutes IS the economy horizon:
#
#   T1   15 min    about 1.25 game years    build-skill tier, largely pre-revenue
#   T2   30 min    about 2.5 game years
#   T3   60 min    about 5 game years       economic performance becomes measurable
#   T4  120 min    about 10 game years      longer-running businesses
#
# ---------------------------------------------------------------------------
# WORLD: locked, except for two dimensions.
# ---------------------------------------------------------------------------
# Locked by benchmark/profile.conf and NOT changeable in a scored run:
#   variety = none          smoothness = smooth      rivers = medium
#   sea_level = medium      map_edges = random       starting_year = 2020
#   town_names = english    number_towns = normal    industry_density = normal
#   landscape = temperate
#
# Landscape is locked for now and expected to open up. The four OpenTTD landscapes
# are genuinely different economies rather than reskins -- cargo chains, town growth
# requirements and available industries all differ -- so each one is really its own
# benchmark. It is still recorded as a result column.
#
# Free to vary, because each is recorded as a result column:
#
#   size_x, size_y   64 | 128 | 256 | 512 | 1024, AND THE SAME AS EACH OTHER
#                    A scored map must be square: rectangles vary only the aspect
#                    ratio, so allowing them would multiply the board by five
#                    without adding a distinct problem. Must be powers of two.
#                    2048 and 4096 are excluded because observation is always the
#                    full entitled game state, and 2048x2048 is 16x the tiles of
#                    1024x1024 -- a payload problem rather than a transport one.
#
#   terrain_type     very_flat | flat | hilly | mountainous | alpinist
#                    "custom" is refused, because it would unlock
#                    custom_terrain_height over 1..255 -- an unbounded world axis
#                    that no leaderboard column discloses, so two very different
#                    runs would read identically.
#
#   seed             any integer. Pin it: reproducibility is what makes a result
#                    checkable, and an unseeded run cannot be regenerated.

scenario {

  name        = "benchmark-t2-example"
  description = "Example T2 benchmark: 30 minutes, 256x256 temperate flat"
  # Identifies the task independently of the file path. There is no version field:
  # any edit worth invalidating a comparison changes the settings, which changes the
  # settings_digest and so the task_id, which a version number only duplicated.
  id          = "benchmark-t2-example"

  map {
    size_x       = 256
    size_y       = 256
    terrain_type = "flat"

    # Pins generation. Only the -G flag actually reproduces a world; the cfg key
    # alone does not, so this is read into _map_seed and passed at spawn.
    seed = 1001
  }

  companies {
    # 0..14 extra company slots. These are NOT opponents: every company is created
    # by the "nttd Idle" AI, which does nothing at all. They are scored only if
    # somebody actually plays them, so extra slots do not add phantom rows.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    # async_realtime for a leaderboard run; heartbeat for RL and ES, where
    # deliberation is unbounded and wall time therefore measures nothing.
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }


  end_conditions {
    logic = "any"

    time_limit {
      enabled      = true
      wall_minutes = 30
    }

    # A scored company that goes bankrupt has nothing left to measure.
    bankruptcy {
      enabled = true
    }
  }
}
