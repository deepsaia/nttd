# Second example, showing what varying the allowed dimensions looks like.
#
# Same profile as t2_example.conf and equally a benchmark run. It differs on three
# of the four free dimensions -- a longer horizon, a bigger sub-arctic map, hilly
# terrain -- and every one of those differences appears as a leaderboard column, so
# a reader can see it is not comparable to a 256x256 temperate flat run and discount
# accordingly.
#
# That is the whole design: vary what you like within the ranges, and the record
# discloses it. See t2_example.conf for the full range documentation.
#
#   uv run nttd benchmark --config config/benchmark/t3_subarctic_example.conf

scenario {

  name        = "benchmark-t3-subarctic-example"
  description = "Example T3 benchmark: 60 minutes, 512x512 sub-arctic hilly"
  id          = "benchmark-t3-subarctic-example"
  version     = "1"

  scored = true

  map {
    # A larger world with more distance between towns, so route planning matters
    # more and the same 60 minutes buys less coverage.
    size_x       = 512
    size_y       = 512
    # Sub-arctic adds a food and goods chain and puts snow above the line, which
    # changes which towns can grow at all.
    landscape    = "sub-arctic"
    # Hills make connections cost more and constrain where track can run.
    terrain_type = "hilly"

    seed = 2001
  }

  companies {
    # Two AI opponents, so cargo and town ratings are contested.
    num_ai_companies     = 2
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }


  end_conditions {
    logic = "any"

    time_limit {
      enabled      = true
      wall_minutes = 60
    }

    bankruptcy {
      enabled = true
    }
  }
}
