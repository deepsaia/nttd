# Benchmark tier T3: 60 wall-minutes, about 5 game years.
#
# A tier fixes only the TIME horizon. The world comes from benchmark/defaults.conf
# plus the three dimensions below, which a variant may change because each is
# recorded as a leaderboard column.
#
# The economy clock is fixed at 1 wall-minute per economy month and no OpenTTD 15.3
# setting changes it, so 60 wall-minutes IS 5 game years. That is why the tier is
# expressed in wall time and the horizon follows from it rather than being set.

scenario {

  name        = "benchmark-t3"
  description = "Benchmark tier T3: 60 minutes, about 5 game years"
  id          = "benchmark-t3"
  version     = "1"

  # Refuses game-mutating operator operations for the life of the session, for
  # every caller, and holds the map to the benchmark profile.
  scored = true

  map {
    include "defaults.conf"

    # Variable dimensions. Recorded in the result so a reader can see them.
    size_x       = 256
    size_y       = 256
    landscape    = "temperate"
    terrain_type = "flat"

    # Pins generation. Only the -G flag actually reproduces a world; the cfg key
    # alone does not, so this is read into _map_seed and passed at spawn.
    seed = 1001
  }

  companies {
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  # Operator-owned. A contestant cannot set its own budget in a scored run.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled      = true
      wall_minutes = 60
    }

    # A scored company that goes bankrupt has nothing left to measure.
    bankruptcy {
      enabled = true
    }
  }
}
