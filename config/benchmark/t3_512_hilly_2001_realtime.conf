# Second example, showing what varying the allowed dimensions looks like.
#
# Same profile as t2_256_flat_1001_realtime.conf and equally a benchmark run. It differs on both free
# dimensions -- a bigger map and hillier terrain -- plus a longer horizon and contested
# cargo, and every one of those differences appears as a result column, so a reader can
# see it is not comparable to a 256x256 flat run and discount accordingly.
#
# That is the whole design: vary what you like within the ranges, and the record
# discloses it. See t2_256_flat_1001_realtime.conf for the full range documentation.
#
# This replaced a sub-arctic example. Landscape is now locked to temperate: the four
# landscapes are genuinely different economies, so each is really a separate benchmark,
# and ranking them in one table before any of them has a populated board would compare
# four problems as though they were one. Sub-arctic is still playable with
# scored = false.
#
#   uv run nttd benchmark --config config/benchmark/t3_512_hilly_2001_realtime.conf

scenario {

  name        = "benchmark-t3-512-hilly-2001-realtime"
  description = "Example T3 benchmark: 60 minutes, 512x512 temperate hilly"
  id          = "benchmark-t3-512-hilly-2001-realtime"


  map {
    # A larger world with more distance between towns, so route planning matters
    # more and the same 60 minutes buys less coverage. Square, because a scored map
    # must be: rectangles vary only the aspect ratio.
    size_x       = 512
    size_y       = 512
    # Hills make connections cost more and constrain where track can run.
    terrain_type = "hilly"

    seed = 2001
  }

  companies {
    # Two extra company slots, NOT opponents. nttd ships only the "nttd Idle" AI,
    # which sleeps forever so a slot exists for a contestant to act through, and
    # num_ai_companies creates more of the same. Nothing competes for cargo or town
    # ratings.
    #
    # nttd will never run a real AI opponent. It would change what the benchmark
    # measures, and change it inconsistently: two runs on one seed would face
    # different pressure depending on which AI was installed and how it played, with
    # nothing on a result row recording either. config_builder refuses to write a
    # config that names any AI but the idle one.
    num_ai_companies     = 2
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled      = true
      wall_minutes = 60
    }

    bankruptcy {
      enabled = true
    }
  }
}
