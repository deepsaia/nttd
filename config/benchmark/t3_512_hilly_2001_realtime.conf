# T3 example benchmark scenario, played in real time.
#
# T3: 60 wall-minutes, which is 1827 game days at OpenTTD's fixed economy clock of
# about 1.97 seconds a day, so it covers the same 20 completed quarters as t3_512_hilly_2001_stepped.
# two years on a larger, hillier world: the first tier where economic performance is
# measurable rather than incidental.
#
# In real time the world moves whether or not the contestant acts, so this measures decisions
# per minute as much as decision quality. That is the right question for an agent meant to keep
# up with a running game, and the wrong one for a policy being trained. See README.md.
#
#   uv run nttd benchmark --config config/benchmark/t3_512_hilly_2001_realtime.conf

scenario {
  name        = "benchmark-t3-512-hilly-2001-realtime"
  description = "T3 benchmark, real time: 60 minutes, 1827 game days"
  id          = "benchmark-t3-512-hilly-2001-realtime"

  map {
    size_x       = 512
    size_y       = 512
    terrain_type = "hilly"
    seed         = 2001
  }

  companies {
    # No AI opponents, by design: nttd measures building a business in an empty market.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  end_conditions {
    logic = "any"
    time_limit {
      enabled      = true
      wall_minutes = 60
    }
    bankruptcy {
      enabled = true
    }
  }
}
