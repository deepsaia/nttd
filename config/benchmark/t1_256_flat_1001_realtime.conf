# T1 example benchmark scenario, played in real time.
#
# T1: 12 wall-minutes, which is 366 game days at OpenTTD's fixed economy clock of
# about 1.97 seconds a day, so it covers the same 4 completed quarters as t1_256_flat_1001_stepped.
# 1 game year, long enough that a standing route has time to earn rather than only to exist.
#
# In real time the world moves whether or not the contestant acts, so this measures decisions
# per minute as much as decision quality. That is the right question for an agent meant to keep
# up with a running game, and the wrong one for a policy being trained. See README.md.
#
#   uv run nttd benchmark --config config/benchmark/t1_256_flat_1001_realtime.conf

scenario {
  name        = "benchmark-t1-256-flat-1001-realtime"
  description = "T1 benchmark, real time: 12 minutes, 366 game days"
  id          = "benchmark-t1-256-flat-1001-realtime"

  map {
    size_x       = 256
    size_y       = 256
    terrain_type = "flat"
    seed         = 1001
  }

  companies {
    # No AI opponents, by design: nttd measures building a business in an empty market.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  end_conditions {
    logic = "any"
    time_limit {
      enabled      = true
      wall_minutes = 12
    }
    bankruptcy {
      enabled = true
    }
  }
}
