# T4 example benchmark scenario, played in stepped mode.
#
# T4: 1827 steps of one game day, 20 completed quarters, ending 2025-01-01.
# five years: long enough for compounding to show, so a bad early network caps a run
# that never went bankrupt.
#
# The world is 512x512 hilly seed 2001, shared with t4_512_hilly_2001_realtime, so the two differ only
# in who owns the clock. See README.md in this directory for the tier table, why the day counts
# are what they are, and why a stepped run is not bounded by wall time.
#
#   uv run nttd benchmark --config config/benchmark/t4_512_hilly_2001_stepped.conf
#
# Your loop then drives it:
#   POST /v1/participant/sessions/{id}/step/reset   -> opening observation
#   POST /v1/participant/sessions/{id}/step         -> flush actions, advance one day, observe

scenario {
  name        = "benchmark-t4-512-hilly-2001-stepped"
  description = "T4 benchmark, stepped: 1827 steps of 1 game-day, 20 quarters"
  id          = "benchmark-t4-512-hilly-2001-stepped"

  map {
    size_x       = 512
    size_y       = 512
    terrain_type = "hilly"
    seed         = 2001
  }

  companies {
    # No AI opponents, by design: nttd measures building a business in an empty market.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "stepped"
    snapshot_interval_days = 1
  }

  heartbeat {
    # One game day per step. A step flushes its actions while the game is paused, so a batch
    # of any size still advances exactly one day.
    interval_days = 1
  }

  end_conditions {
    logic = "any"
    # Bounded in steps, not wall time: the clock only moves when the contestant asks.
    time_limit {
      enabled = false
    }
    max_heartbeats {
      enabled = true
      count   = 1827
    }
    bankruptcy {
      enabled = true
    }
  }
}
