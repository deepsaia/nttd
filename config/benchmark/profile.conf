# The benchmark profile: which worlds a scored run may be played on, and how fast.
#
# This file is the single authority. Edit it to widen, narrow, or freeze what counts
# as a scoreable scenario; nttd reads it at validation time and refuses a scored
# scenario that falls outside it. No code change is needed, which is the point: the
# leaderboard's admission rules are operator policy, not an implementation detail.
#
# A scored scenario need not restate any of this. Omitting a locked setting means
# inheriting it, and the emitted world uses these values -- so a scenario file says
# only what makes it different, and there is no second copy of the rules to drift.

profile {

  # ---------------------------------------------------------------------------
  # locked: must hold exactly in a scored scenario
  # ---------------------------------------------------------------------------
  # These are the settings where a difference changes the problem without being
  # visible to anyone reading a score. Nobody looking at 812 can tell it was earned
  # with denser industry, so the number only means something if the world is fixed.
  #
  # 2020 rather than a mid-century start. Verified against OpenTTD 15.3: the year is
  # accepted unclamped, and every transport mode has more stock to choose from than
  # at 1960 (train 39 -> 40, road 11 -> 21, ship 3 -> 4, aircraft 5 -> 12), so the
  # tech tree is wider rather than narrower.
  #
  # The individual water_borders_* flags are absent deliberately: OpenTTD ignores
  # them unless map_edges = "manual", so locking map_edges already fixes the edges
  # and listing the flags would imply they do something.
  #
  # To make a locked setting variable, move it to `allowed` with its permitted
  # values, and add it to the leaderboard columns in db/result_writer.py.
  locked {
    variety          = "none"
    smoothness       = "smooth"
    rivers           = "medium"
    sea_level        = "medium"
    map_edges        = "random"
    starting_year    = 2020
    town_names       = "english"
    number_towns     = "normal"
    industry_density = "normal"

    # Locked for now, and expected to open up as the board grows. The four
    # landscapes are genuinely different economies rather than reskins -- cargo
    # chains, town growth requirements and available industries all differ -- so
    # each one is really a separate benchmark. Ranking them in one table before
    # any of them has a populated board would compare four problems as though
    # they were one. Move it to `allowed` with its values to open it up.
    landscape        = "temperate"
  }

  # ---------------------------------------------------------------------------
  # allowed: may differ, within these values, because each is disclosed
  # ---------------------------------------------------------------------------
  # Every key here MUST be a recorded leaderboard column, because disclosure is the
  # condition on which it is allowed to vary. A reader who can see that one run was
  # 512x512 mountainous can discount the comparison themselves.
  #
  # Enumerations rather than ranges, deliberately: every one of these is an OpenTTD
  # enum or a power of two, and enumerating means a new value is refused until
  # somebody decides it belongs. Narrow a list to restrict the board; reduce one to a
  # single value to pin that dimension for everyone.
  allowed {
    # ONE list, applied to BOTH map axes: a scored map must be square.
    #
    # Not a restriction for its own sake. Free axes give 5 x 5 = 25 rectangles that
    # differ only in aspect ratio, and a 64x1024 strip is a different transport
    # problem from a 256x256 square without being an interesting one. Requiring
    # size_x = size_y leaves 5 sizes, and 5 x 5 terrain types = 25 scoreable maps,
    # each of which is a genuinely distinct problem.
    #
    # Powers of two, 64..4096 in OpenTTD. 2048 and 4096 are omitted because
    # observation is always the full entitled game state, and 2048x2048 is 16x the
    # tiles of 1024x1024 -- a payload problem rather than a transport one.
    size = [64, 128, 256, 512, 1024]

    # "custom" is deliberately absent. It would unlock custom_terrain_height over
    # 1..255, an unbounded world axis that no leaderboard column discloses, so a
    # height-240 world and a flat one would produce rows reading identically.
    terrain_type = ["very_flat", "flat", "hilly", "mountainous", "alpinist"]
  }

  # ---------------------------------------------------------------------------
  # There is no action limit, in either mode
  # ---------------------------------------------------------------------------
  # There used to be a ceiling of 15 actions per submission. It is gone, and so is
  # the sliding rate window before it.
  #
  # How many actions to spend is the contestant's own optimisation problem, and it is
  # part of what a benchmark should measure rather than something to equalise. A
  # multi-agent system coordinating parallel work, an RL policy batching a route, and
  # a single agent taking one action at a time are making different bets, and each
  # pays for its own in tokens and compute.
  #
  # Nothing is bought by removing it either. Real-time play is bounded by
  # wall-minutes and the world moves whether or not a contestant acts, so an action
  # already costs game time. Stepped play is bounded by how many steps a run takes
  # and how many game-days each step advances, both fixed by the scenario, so a
  # larger batch cannot buy more world than another contestant gets.

  # ---------------------------------------------------------------------------
  # scenario_allowlist: restrict scoring to named scenarios (optional)
  # ---------------------------------------------------------------------------
  # Empty means any scenario inside the profile above may be scored, which is the
  # default and the intended long-run posture: conformance is the credential, and a
  # contestant who writes their own conforming world is playing a real benchmark.
  #
  # Listing scenario ids here narrows scoring to exactly those, for when the board
  # needs a fixed slate -- a seasonal competition, a paper's reproduction set, or a
  # freeze while a scoring change lands. A scenario whose id is absent is then
  # refused as scored, with the list quoted back so the author can see why.
  #
  # Ids are the scenario's `id` field (falling back to `name`), NOT file paths, so
  # moving or copying a file does not change whether it is admitted.
  scenario_allowlist = []
}
