# T4 example benchmark scenario, played in real time.
#
# T4: 120 wall-minutes, which is 3653 game days at OpenTTD's fixed economy clock of
# about 1.97 seconds a day, so it covers the same 40 completed quarters as t4_512_hilly_2001_stepped.
# five years: long enough for compounding to show, so a bad early network caps a run
# that never went bankrupt.
#
# In real time the world moves whether or not the contestant acts, so this measures decisions
# per minute as much as decision quality. That is the right question for an agent meant to keep
# up with a running game, and the wrong one for a policy being trained. See README.md.
#
#   uv run nttd benchmark --config config/benchmark/t4_512_hilly_2001_realtime.conf

scenario {
  name        = "benchmark-t4-512-hilly-2001-realtime"
  description = "T4 benchmark, real time: 120 minutes, 3653 game days"
  id          = "benchmark-t4-512-hilly-2001-realtime"

  map {
    size_x       = 512
    size_y       = 512
    terrain_type = "hilly"
    seed         = 2001
  }

  companies {
    # No AI opponents, by design: nttd measures building a business in an empty market.
    num_ai_companies     = 0
    competitors_interval = 0
    max_loan             = 300000
  }

  runtime {
    mode                   = "async_realtime"
    snapshot_interval_days = 1
  }

  end_conditions {
    logic = "any"
    time_limit {
      enabled      = true
      wall_minutes = 120
    }
    bankruptcy {
      enabled = true
    }
  }
}
