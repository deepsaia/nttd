# 30-minute 3-agent benchmark: road + air + water agents
# All 3 agents share 1 company, gpt-5.2, observation_mode=agent

scenario {

  name        = "3agent-road-air-water-30min"
  description = "30-minute benchmark with road, air, and water agents on shared company"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    # Was "hilly", but nttd's terrain enum was off by one, so these maps
    # were always generated Flat. Pinned to "flat" to preserve the terrain
    # these benchmarks actually ran on; set "hilly" for genuinely hilly maps.
    terrain_type = "flat"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    # Map generation seed. Reproducibility requires this: the same seed
    # yields the same world, which is what makes runs comparable.
    seed = 1001
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    # game_speed removed: OpenTTD 15.3 has no speed control. The economy
    # clock is fixed at 1 wall-minute per economy month.
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 0
  }

  # Operator-owned pacing and budget limits. Enforced only when scored = true,
  # so a contestant cannot set their own budget in a scored run.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
    observation_mode      = "agent"
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 30
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "road_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "road"
      instructions_file = "examples/agent_instructions.py:get_road_agent_prompt"
      observation_mode  = "agent"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 5
    },
    {
      agent_id          = "air_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "air"
      instructions_file = "examples/agent_instructions.py:get_air_agent_prompt"
      observation_mode  = "agent"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 5
    },
    {
      agent_id          = "water_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "water"
      instructions_file = "examples/agent_instructions.py:get_water_agent_prompt"
      observation_mode  = "agent"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 5
    }
  ]
}
