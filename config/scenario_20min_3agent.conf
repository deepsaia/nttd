# 20-minute 3-agent experiment scenario
# 3 agents (road, rail, water) sharing 1 company, 0 AI opponents

scenario {

  name        = "3agent-20min"
  description = "20-minute experiment with 3 specialized agents (road, rail, water)"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 300
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 20
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "rail_agent"
      company_id        = 0
      framework         = "langchain"
      model             = "gpt-5.2"
      agent_type        = "rail"
      instructions_file = "examples/agent_instructions.py:get_rail_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    },
    {
      agent_id          = "road_agent"
      company_id        = 0
      framework         = "langchain"
      model             = "gpt-5.2"
      agent_type        = "road"
      instructions_file = "examples/agent_instructions.py:get_road_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    },
    {
      agent_id          = "water_agent"
      company_id        = 0
      framework         = "langchain"
      model             = "gpt-5.2"
      agent_type        = "water"
      instructions_file = "examples/agent_instructions.py:get_water_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    }
  ]
}
