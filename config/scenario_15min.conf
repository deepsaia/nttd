# 15-minute 4-agent test scenario
# 4 agent companies (road, rail, air, water), 0 AI opponents

scenario {

  name        = "4agent-15min"
  description = "15-minute test with 4 specialized agents"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    # Was "hilly", but nttd's terrain enum was off by one, so these maps
    # were always generated Flat. Pinned to "flat" to preserve the terrain
    # these benchmarks actually ran on; set "hilly" for genuinely hilly maps.
    terrain_type = "flat"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 2020
    # Map generation seed. Reproducibility requires this: the same seed
    # yields the same world, which is what makes runs comparable.
    seed = 1001
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  heartbeat {
    interval_days = 30
    action_window_seconds = 5.0
    # game_speed removed: OpenTTD 15.3 has no speed control. The economy
    # clock is fixed at 1 wall-minute per economy month.
  }

  runtime {
    mode = "async_realtime"
    snapshot_interval_days = 1
    screenshot_interval_seconds = 60    # 0 to disable
    screenshot_type = "minimap"         # normal | giant | minimap
    save_interval_seconds = 300         # 0 to disable
  }

  # Operator-owned pacing and budget limits. Enforced only when scored = true,
  # so a contestant cannot set their own budget in a scored run.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 15
    }

    game_date_limit {
      enabled = false
      end_year = 2000
    }

    revenue_threshold {
      enabled = false
      total_revenue = 1000000
    }

    cargo_threshold {
      enabled = false
      total_cargo_delivered = 50000
    }

    max_heartbeats {
      enabled = false
      count = 1000
    }
  }
}
