# 15-minute 4-agent test scenario
# 4 agent companies (road, rail, air, water), 0 AI opponents

scenario {

  name        = "4agent-15min"
  description = "15-minute test with 4 specialized agents"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  heartbeat {
    interval_days = 30
    action_window_seconds = 5.0
    game_speed = 1
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 60    # 0 to disable
    screenshot_type = "minimap"         # normal | giant | minimap
    save_interval_seconds = 300         # 0 to disable
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 15
    }

    game_date_limit {
      enabled = false
      end_year = 2000
    }

    revenue_threshold {
      enabled = false
      total_revenue = 1000000
    }

    cargo_threshold {
      enabled = false
      total_cargo_delivered = 50000
    }

    max_heartbeats {
      enabled = false
      count = 1000
    }
  }
}
