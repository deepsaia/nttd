# nttd scenario configuration
# Format: HOCON (Human-Optimized Config Object Notation)
#
# All end conditions default to disabled. Enable any combination.
# logic = "any"  -> first condition met stops the simulation
# logic = "all"  -> every enabled condition must be met before stopping

scenario {

  name        = "default"
  description = "Standard benchmark scenario"

  # ---------------------------------------------------------------------------
  # Map / world generation
  # ---------------------------------------------------------------------------
  map {
    # Powers of two: 64, 128, 256, 512, 1024, 2048, 4096
    size_x = 256
    size_y = 256

    # temperate | sub-arctic | sub-tropical | toyland
    landscape = "temperate"

    # flat | hilly | mountainous | alpinist | custom
    terrain_type = "hilly"

    # 1-255, only used when terrain_type = "custom"
    custom_terrain_height = 30

    # none | very_low | low | medium | high | very_high
    variety = "none"

    # very_smooth | smooth | rough | very_rough
    smoothness = "smooth"

    # none | few | medium | many
    rivers = "medium"

    # very_low | low | medium | high | custom
    sea_level = "medium"

    # 1-90 (percentage), only used when sea_level = "custom"
    custom_sea_level = 1

    # random | manual | all_water
    map_edges = "random"

    # For manual edges (0 = freeform, 1 = water):
    water_borders_nw = 0
    water_borders_ne = 0
    water_borders_sw = 0
    water_borders_se = 0

    starting_year = 1950

    # english | english_additional | french | german | american | latin_american
    # silly | swedish | dutch | finnish | polish | slovak | norwegian | hungarian
    # austrian | romanian | czech | swiss | danish | turkish | italian | catalan
    town_names = "english"

    # very_low | low | normal | high | custom
    number_towns = "normal"

    # Only used when number_towns = "custom"
    custom_town_number = 1

    # funding_only | minimal | very_low | low | normal | high | custom
    industry_density = "normal"

    # Only used when industry_density = "custom"
    custom_industry_number = 1
  }

  # ---------------------------------------------------------------------------
  # Company / AI setup
  # ---------------------------------------------------------------------------
  companies {
    # Number of AI opponent companies (0-14)
    num_ai_companies = 2

    # Minutes between AI company starts (0 = immediate)
    competitors_interval = 0

    max_loan = 300000
  }

  # ---------------------------------------------------------------------------
  # Heartbeat mode settings (used when runtime.mode = "heartbeat")
  # ---------------------------------------------------------------------------
  heartbeat {
    # Game-days between heartbeat beats
    interval_days = 30

    # Seconds the server waits for agent actions after each snapshot delivery
    action_window_seconds = 5.0

    # OpenTTD game speed multiplier (1 = normal, 4 = fast, 128 = turbo)
    game_speed = 1
  }

  # ---------------------------------------------------------------------------
  # Runtime
  # ---------------------------------------------------------------------------
  runtime {
    # async_realtime | heartbeat
    mode = "async_realtime"

    # OpenTTD game speed multiplier (1 = normal, 4 = fast, 128 = turbo)
    game_speed = 1

    # Game-days between snapshot captures to Parquet (1 = every day)
    snapshot_interval_days = 1

    # Periodic minimap screenshot interval in seconds (0 = disabled)
    # Works in headless (-D) mode. Types: normal | giant | minimap
    screenshot_interval_seconds = 60
    screenshot_type = "minimap"

    # Periodic game save interval in seconds (0 = disabled)
    save_interval_seconds = 300
  }

  # ---------------------------------------------------------------------------
  # End conditions
  # Combination logic: "any" (default) or "all"
  # ---------------------------------------------------------------------------
  end_conditions {

    # "any" = first condition met stops the game
    # "all" = all enabled conditions must be met simultaneously
    logic = "any"

    # ---- Wall-clock time limit -------------------------------------------
    time_limit {
      enabled      = true
      # real-world minutes; common: 10, 30, 60, 120
      wall_minutes = 60
    }

    # ---- In-game calendar date ------------------------------------------
    game_date_limit {
      enabled  = false
      end_year = 2000
    }

    # ---- Revenue threshold (any single company) -------------------------
    revenue_threshold {
      enabled       = false
      total_revenue = 1000000
    }

    # ---- Cargo delivered threshold (network total) ----------------------
    cargo_threshold {
      enabled               = false
      total_cargo_delivered = 50000
    }

    # ---- Heartbeat count ------------------------------------------------
    max_heartbeats {
      enabled = false
      count   = 1000
    }
  }
}
