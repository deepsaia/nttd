# nttd scenario configuration
# Format: HOCON (Human-Optimized Config Object Notation)
# Load with: uv pip install pyhocon  OR  uv sync --extra scenario
#
# All end conditions default to disabled. Enable any combination.
# logic = "any"  → first condition met stops the simulation
# logic = "all"  → every enabled condition must be met before stopping

scenario {

  name        = "default"
  description = "Standard benchmark scenario"

  # ---------------------------------------------------------------------------
  # Map / world generation
  # ---------------------------------------------------------------------------
  map {
    # Powers of two: 64, 128, 256, 512, 1024
    size_x = 256
    size_y = 256

    # temperate | arctic | tropic | toyland
    landscape = "temperate"

    # 0 = flat, 1 = hilly, 2 = mountainous, 3 = custom
    terrain_type = 1

    starting_year = 1950

    # 0 = very low ... 4 = very high
    number_towns = 2

    # 0 = none, 1 = very low, 2 = low, 3 = medium, 4 = high, 5 = very high
    industry_density = 4

    # Seconds between heartbeats during a game-day (rough: 1 day ~ 0.5s at normal speed)
    # Override game speed via heartbeat section instead.
  }

  # ---------------------------------------------------------------------------
  # Company setup
  # ---------------------------------------------------------------------------
  companies {
    num_ai_companies = 2
    max_loan         = 300000
  }

  # ---------------------------------------------------------------------------
  # Heartbeat / runtime
  # ---------------------------------------------------------------------------
  heartbeat {
    # Game-days between heartbeat beats
    interval_days = 30

    # Seconds the server waits for agent actions after each snapshot delivery
    action_window_seconds = 5.0

    # OpenTTD game speed multiplier (1 = normal, 4 = fast, 128 = turbo)
    game_speed = 1
  }

  # ---------------------------------------------------------------------------
  # End conditions
  # Combination logic: "any" (default) or "all"
  # ---------------------------------------------------------------------------
  end_conditions {

    # "any" = first condition met stops the game
    # "all" = all enabled conditions must be met simultaneously
    logic = "any"

    # ---- Wall-clock time limit -------------------------------------------
    time_limit {
      enabled      = true
      # real-world minutes; common: 10, 30, 60, 120
      wall_minutes = 60
    }

    # ---- In-game calendar date ------------------------------------------
    game_date_limit {
      enabled  = false
      end_year = 2000
    }

    # ---- Revenue threshold (any single company) -------------------------
    revenue_threshold {
      enabled       = false
      # £/$ cumulative income for one company
      total_revenue = 1000000
    }

    # ---- Cargo delivered threshold (network total) ----------------------
    cargo_threshold {
      enabled               = false
      # units of cargo delivered across all companies
      total_cargo_delivered = 50000
    }

    # ---- Heartbeat count ------------------------------------------------
    max_heartbeats {
      enabled = false
      count   = 1000
    }
  }
}
