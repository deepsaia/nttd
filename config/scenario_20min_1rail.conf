# 20-minute single rail agent benchmark
# 1 agent (rail), gpt-5.2, company 0, observation_mode=agent

scenario {

  name        = "rail-only-20min"
  description = "20-minute benchmark with a single rail agent to test rail pipeline in isolation"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 0
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 20
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "rail_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "rail"
      instructions_file = "examples/agent_instructions.py:get_rail_agent_prompt"
      observation_mode  = "agent"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 5
    }
  ]
}
