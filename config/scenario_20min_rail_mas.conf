# 20-minute rail MAS benchmark via neuro-san
# Requires neuro-san server running on port 8080 with rail_mas agent network

scenario {

  name        = "rail-mas-20min"
  description = "20-minute benchmark with neuro-san rail multi-agent system"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1960
    town_names = "english"
    number_towns = "high"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 0
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 20
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "rail_mas"
      company_id        = 0
      framework         = "mas"
      model             = "gpt-5.2 (neuro-san)"
      agent_type        = "rail"
      instructions      = """Run this cycle. Your goal is to generate and increase revenue over time by building profitable rail routes. 
      Use your agents and tools and take necessary actions to do so consistently."""
      snapshot_class    = "mas_rail"
      include_finance   = true
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 50
      mas_transport {
        transport = "http"
        protocol  = "neuro_san"
        endpoint  = "http://localhost:8080/api/v1/rail_mas/streaming_chat"
        timeout   = 300.0
        retry_count = 1
        retry_backoff = 2.0
      }
    }
  ]
}
