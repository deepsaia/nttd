# 10-minute experiment scenario
# Small map with 4 towns, all vehicle types available (year 1960)
# Tests full agent pipeline: observe, decide, act, cargo delivery

scenario {

  name        = "experiment-10min"
  description = "10-minute agent experiment -- small map, 4 towns, all transport modes"

  map {
    size_x = 128
    size_y = 128
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "high"
    map_edges = "random"
    starting_year = 1960
    town_names = "english"
    number_towns = "high"
    custom_town_number = 4
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 30
    screenshot_type = "minimap"
    save_interval_seconds = 120
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 10
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "transport_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "road"
      instructions_file = "examples/agent_instructions.py:get_road_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    }
  ]
}
