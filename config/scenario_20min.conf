# 20-minute 4-agent experiment scenario
# 4 agents (road, rail, air, water) sharing 1 company, 0 AI opponents

scenario {

  name        = "4agent-20min"
  description = "20-minute experiment with 4 specialized agents"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1950
    town_names = "english"
    number_towns = "normal"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 60
    screenshot_type = "minimap"
    save_interval_seconds = 300
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 20
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }
}
