# Diagnostic scenario: 5 minutes, air + water agents only
# Purpose: debug ERR_UNKNOWN on add_order for aircraft/ships

scenario {

  name        = "diag-air-water"
  description = "5-minute diagnostic run for air/water order bug"

  map {
    size_x = 128
    size_y = 128
    landscape = "temperate"
    terrain_type = "flat"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "high"
    map_edges = "random"
    starting_year = 1960
    # Map generation seed. Reproducibility requires this: the same seed
    # yields the same world, which is what makes runs comparable.
    seed = 1001
    town_names = "english"
    number_towns = "high"
    custom_town_number = 4
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  runtime {
    mode = "async_realtime"
    # game_speed removed: OpenTTD 15.3 has no speed control. The economy
    # clock is fixed at 1 wall-minute per economy month.
    snapshot_interval_days = 1
    screenshot_interval_seconds = 0
    screenshot_type = "minimap"
    save_interval_seconds = 0
  }

  # Operator-owned pacing and budget limits. Enforced only when scored = true,
  # so a contestant cannot set their own budget in a scored run.
  fairness {
    poll_interval         = 10.0
    max_actions_per_cycle = 15
    max_history_cycles    = 10
    llm_timeout_seconds   = 120.0
    observation_mode      = "agent"
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 5
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }

  agents = [
    {
      agent_id          = "air_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "air"
      instructions_file = "examples/agent_instructions.py:get_air_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    },
    {
      agent_id          = "water_agent"
      company_id        = 0
      nttd_framework    = "langchain"
      model             = "gpt-5.2"
      agent_type        = "water"
      instructions_file = "examples/agent_instructions.py:get_water_agent_prompt"
      observation_mode  = "compact"
      poll_interval     = 10.0
      observation_tools = true
      max_actions_per_cycle = 10
    }
  ]
}
