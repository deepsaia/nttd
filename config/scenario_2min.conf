# 2-minute smoke test scenario
# Quick validation that all data capture works

scenario {

  name        = "smoke-test-2min"
  description = "2-minute smoke test for data capture validation"

  map {
    size_x = 256
    size_y = 256
    landscape = "temperate"
    terrain_type = "hilly"
    variety = "none"
    smoothness = "smooth"
    rivers = "medium"
    sea_level = "medium"
    map_edges = "random"
    starting_year = 1950
    town_names = "english"
    number_towns = "normal"
    industry_density = "normal"
  }

  companies {
    num_ai_companies = 0
    competitors_interval = 0
    max_loan = 300000
  }

  heartbeat {
    interval_days = 30
    action_window_seconds = 5.0
    game_speed = 1
  }

  runtime {
    mode = "async_realtime"
    game_speed = 1
    snapshot_interval_days = 1
    screenshot_interval_seconds = 30    # every 30s for quick test
    screenshot_type = "minimap"
    save_interval_seconds = 60          # one save at ~60s
  }

  end_conditions {
    logic = "any"

    time_limit {
      enabled = true
      wall_minutes = 2
    }

    game_date_limit {
      enabled = false
    }

    revenue_threshold {
      enabled = false
    }

    cargo_threshold {
      enabled = false
    }

    max_heartbeats {
      enabled = false
    }
  }
}
